[package]
name = "profile-code"
version = "0.1.0"
edition = "2024"
publish = false
description = "Offline research tool: inventory BIOS modules and find profile save/load anchors"

# Not part of the product workspace: its own lock file, never built by CI.
[workspace]

[dependencies]
ocb-core = { path = "../../../crates/core" }
serde_json = "1"
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
